<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roselab | Contacto</title>

<!-- Importación de la tipografía Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    /* Fondo con degradado suave de la paleta corporativa */
    background: linear-gradient(135deg, #FAEBE1 0%, #FAD2CD 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 45px 35px;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(45, 25, 30, 0.08);
    text-align: center;
    border: 1px solid rgba(243, 213, 214, 0.6);
}

.logo {
    max-width: 240px; /* Ajuste para el formato horizontal del logo */
    width: 100%;
    height: auto;
    margin-bottom: 25px;
}

h1 {
    color: #2D191E;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
}

p {
    color: #2D191E;
    opacity: 0.75;
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 30px;
    line-height: 1.5;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    text-decoration: none;
    background-color: #F3D5D6;
    color: #2D191E;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-size: 17px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(243, 213, 214, 0.4);
}

.boton:hover {
    background-color: #FAD2CD;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(250, 210, 205, 0.6);
}

.boton:active {
    transform: translateY(0);
}

.boton:last-child {
    margin-bottom: 0;
}
</style>
</head>

<body>

<div class="card">

    <!-- Asegúrate de subir tu archivo original renombrado como logo.png -->
    <img src="logo.png" alt="RoseLab Cosmetics" class="logo">

    <h1>Seleccione su región</h1>

    <p>Será atendido por el asesor correspondiente</p>

    <!-- Botón Región Centro -->
    <a class="boton"https://script.google.com/macros/s/AKfycbzJGqLUmzORSJrsalwR-4cLKZvxpboLaoSm02dWgYpmD-JoNB22Rm4M4uDGgbdtFciKsw/exec" 
       target="_blank" 
       rel="noopener noreferrer">
       <span>📍</span> Centro
    </a>

    <!-- Botón Región Occidente -->
    <a class="boton" 
       href="https://script.google.com/macros/s/AKfycbzJGqLUmzORSJrsalwR-4cLKZvxpboLaoSm02dWgYpmD-JoNB22Rm4M4uDGgbdtFciKsw/exec" 
       target="_blank" 
       rel="noopener noreferrer">
       <span>📍</span> Occidente
    </a>

</div>

</body>
</html>
